<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASH 2026 Planner</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1b1f24;--muted:#5d6670;--line:#e1e5ea;--accent:#8a1c1c;--accent2:#1f5f8b;--attend:#1e7d46;--maybe:#b7791f;--skip:#8d969e;--chip:#eef1f4;--hl:#fff3c4;--graph:#2b6cb0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.tabs button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;padding:4px 12px;border-radius:999px;cursor:pointer;margin-right:4px;font-size:13px}
.tabs button.active{background:#fff;color:var(--accent);font-weight:600}
header .stats{margin-left:auto;font-size:12px;opacity:.92}
header .who{font-size:12px;background:rgba(255,255,255,.15);border-radius:999px;padding:2px 10px;cursor:pointer}
#app{display:grid;grid-template-columns:270px minmax(0,1fr) 460px;gap:10px;padding:10px;height:calc(100vh - 46px)}
aside,main,#detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0}
aside{padding:12px}
main{padding:0}
#detail{padding:14px 16px}
h3.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
h3.sec:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;user-select:none;white-space:nowrap}
.chip.on{background:var(--accent2);color:#fff}
.chip.small{font-size:11px;padding:1px 7px;cursor:default}
.chip.term{background:var(--hl);border-color:#e8d58a;cursor:default}
.chip.gterm{background:#e3eefb;border-color:#b9d2f0;cursor:default}
.chip.shared{background:#f3e8ff;border-color:#d6bcfa;cursor:default}
a.chip{text-decoration:none;color:inherit;cursor:pointer}
input[type=text],input[type=search],input[type=number],textarea,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;background:#fff;color:var(--ink)}
textarea{resize:vertical}
label.row{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0;cursor:pointer}
button.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
button.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.btn.danger{color:var(--accent)}
button.btn.tiny{padding:1px 7px;font-size:11px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.toolbar .count{color:var(--muted);font-size:12px;margin-left:auto}
.row-item{display:grid;grid-template-columns:54px 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.row-item:hover{background:#fafbfc}
.row-item.sel{background:#f1f6fb}
.row-item.attend{border-left:4px solid var(--attend)}
.row-item.maybe{border-left:4px solid var(--maybe)}
.row-item.skip{opacity:.5;border-left:4px solid var(--skip)}
.score{font-weight:700;font-size:15px;text-align:right;line-height:1.1}
.score small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.bar{height:4px;background:#e9ecef;border-radius:2px;margin-top:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent2)}
.bar b{display:block;height:100%;background:#90b4e0}
.title{font-weight:600;line-height:1.3}
.meta{color:var(--muted);font-size:12px;margin-top:2px}
.type{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);margin-right:6px;vertical-align:middle}
.type.session{background:#e8eef7;color:#2a4d7a}.type.abstract{background:#eaf5ec;color:#246b3b}.type.talk{background:#f6ecf7;color:#6b2a74}
.cme{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:#fdecec;color:var(--accent);margin-left:4px;vertical-align:middle}
.decide{display:flex;gap:3px}
.decide button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:28px;cursor:pointer;font-size:14px;line-height:1}
.decide button.on.attend{background:var(--attend);color:#fff;border-color:var(--attend)}
.decide button.on.maybe{background:var(--maybe);color:#fff;border-color:var(--maybe)}
.decide button.on.skip{background:var(--skip);color:#fff;border-color:var(--skip)}
.more{display:block;width:100%;padding:12px;background:#fafbfc;border:0;border-top:1px solid var(--line);cursor:pointer;font:inherit;color:var(--accent2)}
#detail h2{font-size:17px;line-height:1.3;margin:4px 0 8px}
#detail .kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:13px;margin:8px 0}
#detail .kv b{color:var(--muted);font-weight:500}
#detail .abstract{white-space:pre-wrap;font-size:13.5px;line-height:1.55;border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
#detail a{color:var(--accent2)}
.child{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:start;cursor:pointer}
.child .t{color:var(--muted);font-size:12px}
.why{font-size:12.5px;margin:4px 0}
.why b{font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}
.banner{grid-column:1 / -1;background:#f3e8ff;border:1px solid #d6bcfa;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
/* profile */
.topic{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fcfcfd}
.topic .head{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.topic .head input[type=text]{flex:1}
.topic .head select{width:70px}
.topic textarea{font-size:12.5px;min-height:46px}
.pw{display:grid;grid-template-columns:1fr 70px;gap:4px 8px;align-items:center;font-size:12.5px}
.slider{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
/* calendar */
#cal{display:none;grid-column:1 / -1;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;padding:12px}
.cal-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.grid{display:grid;grid-template-columns:52px repeat(var(--days),minmax(170px,1fr));gap:0;position:relative;border-top:1px solid var(--line)}
.gcol{position:relative;border-left:1px solid var(--line);height:calc(var(--hours) * 60px)}
.gcol.axis{border-left:0}
.gcol .hr{position:absolute;left:0;right:0;border-top:1px solid #eef0f3;font-size:10px;color:var(--muted);padding-left:4px}
.dayhead{font-weight:600;padding:6px 8px;border-left:1px solid var(--line);background:#fafbfc;font-size:13px}
.ev{position:absolute;border-radius:6px;padding:4px 6px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.08)}
.ev.attend{background:#dff3e6;border-color:#9fd3b2}
.ev.maybe{background:#fbefd6;border-color:#ecd39b}
.ev.conflict{outline:2px solid var(--accent)}
.ev .t{color:var(--muted);font-size:10.5px}
.ev .loc{color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist{margin-top:14px}
.plist h4{margin:10px 0 4px;font-size:14px}
.plist li{font-size:13px;margin:2px 0}
.legend{font-size:12px;color:var(--muted)}
.conflicts{background:#fdecec;border:1px solid #f3b9b9;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
/* keyword web */
#web{display:none;grid-column:1 / -1;grid-template-columns:300px minmax(0,1fr) 360px;gap:10px;min-height:0}
#web.on{display:grid}
#web > div{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0;padding:12px}
#webmain{padding:0 !important;position:relative;overflow:hidden !important}
#webcanvas{width:100%;height:100%;display:block;cursor:grab}
.kw{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.kw .w{color:var(--muted);font-size:11px;white-space:nowrap}
.kw.seed{background:#fffbea}
.kw.muted{opacity:.45}
.kw a{color:var(--ink);text-decoration:none;font-weight:500}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:9}
@media (max-width:1100px){#app{grid-template-columns:240px 1fr;height:auto}#detail{grid-column:1 / -1;max-height:70vh}#web.on{grid-template-columns:1fr}#webmain{height:60vh}}
@media (max-width:760px){#app{grid-template-columns:1fr}aside{max-height:40vh}}
mark{background:var(--hl);padding:0 1px}
</style>
</head>
<body>
<header>
  <h1>ASH 2026 Planner</h1>
  <div class="tabs">
    <button data-tab="rank" class="active">Rank &amp; review</button>
    <button data-tab="cal">My calendar</button>
    <button data-tab="web">Keyword web</button>
    <button data-tab="profile">Interests</button>
  </div>
  <span class="who" id="who" title="Click to set your name">You</span>
  <div class="stats" id="stats"></div>
</header>
<div id="app">
  <div class="banner" id="banner" style="display:none"></div>
  <aside id="side"></aside>
  <main id="main"></main>
  <section id="detail"><div class="empty">Select an item to see details.</div></section>
  <section id="cal"></section>
  <section id="web"></section>
</div>
<div id="toast"></div>
<script src="data/core.js"></script>
<script src="data/abstracts.js"></script>
<script src="data/graph.js"></script>
<script>
'use strict';
// ---------- default interest profile (edit in the Interests tab) ----------
const DEFAULT_PROFILE = {
  topics: [
    {name:'Allogeneic HCT & GVHD', weight:5, terms:['allogeneic','allo-HCT','alloHCT','hematopoietic cell transplant','hematopoietic stem cell transplant','stem cell transplant','HSCT','HCT','GVHD','graft-versus-host','graft versus host','graft-versus-leukemia','GVL','post-transplant cyclophosphamide','PTCy','conditioning regimen','haploidentical','cord blood','donor selection','chimerism','non-relapse mortality','GRFS','ruxolitinib','abatacept','belumosudil','axatilimab','transplant']},
    {name:'Immune reconstitution & T-cell biology', weight:5, terms:['immune reconstitution','immune recovery','T-cell reconstitution','T cell reconstitution','thymic','thymopoiesis','TREC','TCR repertoire','T-cell receptor repertoire','regulatory T','Treg','T-cell exhaustion','memory T cell','naive T cell','PD-1','lymphocyte recovery','NK cell reconstitution','CMV reactivation','viral reactivation','alloreactive','T cell depletion','T-cell depletion']},
    {name:'Cellular therapy (CAR-T, bispecifics)', weight:4, terms:['CAR-T','CAR T','chimeric antigen receptor','cellular therapy','cell therapy','adoptive','bispecific','T-cell engager','cytokine release syndrome','ICANS','virus-specific T cells','NK cell therapy','allogeneic CAR','TIL','gene-modified']},
    {name:'Immune monitoring & flow cytometry', weight:4, terms:['flow cytometry','spectral cytometry','spectral flow','mass cytometry','CyTOF','immunophenotyping','immune profiling','immune monitoring','single-cell','scRNA-seq','CITE-seq','multiomic','immunopeptidom','biomarker','high-dimensional']},
    {name:'AI, data science & real-world data', weight:3, terms:['machine learning','artificial intelligence','deep learning','natural language processing','large language model','LLM','predictive model','prediction model','real-world','registry','CIBMTR','EBMT','electronic health record','EHR','digital','computational']},
    {name:'Outcomes & health services', weight:2, terms:['outcomes research','quality of life','patient-reported','survivorship','late effects','cost-effectiveness','access to transplant','disparities','health services','telehealth']},
    {name:'Myeloid disease context (AML/MDS, MRD)', weight:2, terms:['acute myeloid leukemia','AML','myelodysplastic','MDS','measurable residual disease','MRD','relapse after transplant','post-transplant maintenance','venetoclax','hypomethylating']},
  ],
  people: [],
  institutions: ['Weill Cornell'],
  negatives: [],
  programWeights: {'Education Program':1.3,'Scientific Program':1.3,'Scientific Symposia':1.3,'Scientific Workshops':1.1,'Special-Interest Sessions':1.1,'Special-Interest Sessions and Studios':1.1,'Marquee Sessions':1.2,'Marquee Sessions and Lectures':1.2,'How I Treat':1.2,'Meet the Scientist':1.1,'Education Spotlight Sessions':1.1,'Scientific Spotlight Sessions':1.1,'Oral Abstract Session':1.0,'Poster Abstract Session':0.7,'Clinical Trial Showcases':0.8,'Friday Satellite Symposia':0.6,'Satellite Symposia':0.6,'Trainee Activities and Services':0.5,'Events':0.3,'ASH-Sponsored Events':0.4,'Product Theaters':0.3,'Industry Theaters':0.3,'Industry Forums':0.3,'Company Showcases':0.3,'ASH Poster Walks':0.9,'Blood Journals Studio':0.5,'ASH Wellness Studio':0.2,'MedEd Talks':0.6,'Treating Fairly Talks':0.6},
  graph: {strength:1.0, alpha:0.35, hops:2, muted:[]}
};
// ---------- data ----------
const DATA = window.ASH_DATA || {meta:{}, items:[]};
const ABS = window.ASH_ABSTRACTS || {};
const G = window.ASH_GRAPH || null;
const items = DATA.items;
const byId = new Map(items.map(i => [i.id, i]));
const DAYNAMES = {'2026-12-09':'Wed 9','2026-12-10':'Thu 10','2026-12-11':'Fri 11','2026-12-12':'Sat 12','2026-12-13':'Sun 13','2026-12-14':'Mon 14','2026-12-15':'Tue 15','2026-12-16':'Wed 16','2026-12-17':'Thu 17','2026-12-18':'Fri 18'};
function stripDisclosures(s){ if(!s) return ''; const out=[]; const L=s.split('\n'); for(let i=0;i<L.length;i++){ const l=L[i].trim(); if(/^Disclosures?:/i.test(l)){ i++; continue; } if(/^No relevant conflicts/i.test(l)) continue; if(/ - (Honoraria|Research Funding|Consultancy|Membership on a Board|Current Employment|Speakers Bureau|Current equity|Patents|Other|Stock)/.test(l)) continue; out.push(L[i]); } return out.join('\n'); }
function toMin(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }
for (const it of items) {
  const a = ABS[it.id] || {};
  it.abstract = a.abstract || ''; it.description = a.description || ''; it.ep_description = a.ep_description || '';
  it.affiliations = a.affiliations || {}; it.disclosures = a.disclosures || '';
  if (a.author_affil) (it.authors||[]).forEach((au, i) => { au.affil = a.author_affil[i] || []; });
  if ((!it.keywords || !it.keywords.length) && it.parent_id) { const p = byId.get(it.parent_id); if (p && p.keywords) it.keywords = p.keywords; }
  it._title = it.title || ''; it._kw = (it.keywords||[]).join(' | '); it._sess = it.session_title || '';
  it._abs = it.abstract; it._desc = (it.description + '\n' + stripDisclosures(it.ep_description)).trim();
  it._people = [...(it.presenters||[]), ...(it.participants||[]).map(p=>p.name), ...(it.authors||[]).map(p=>p.name), ...(it.ep_speakers||[])].join(' | ');
  it._aff = Object.values(it.affiliations).join(' | ');
  it._blob = (it._title + ' ' + it._kw + ' ' + it._sess + ' ' + it._people + ' ' + it._aff + ' ' + it._abs + ' ' + it._desc + ' ' + (it.number||'') + ' ' + (it.location||'')).toLowerCase();
  it._min = it.start ? toMin(it.start) : null; it._max = it.end ? toMin(it.end) : null;
  const gt = G && G.items[it.id]; it._gt = gt ? gt[0] : []; it._gb = gt ? gt[1] : [];
}
const programs = [...new Set(items.map(i=>i.program).filter(Boolean))].sort();
const days = [...new Set(items.map(i=>i.date).filter(Boolean))].sort();
// keyword-web index
const GN = G ? G.terms.length : 0;
const gLabel = G ? G.terms.map(t => t.label) : [];
const normKey = s => String(s||'').toLowerCase().replace(/[\s\-\u2010-\u2015_]+/g, '');
const gIndex = new Map();
if (G) G.terms.forEach(t => { const k = normKey(t.label); if (!gIndex.has(k)) gIndex.set(k, t.id); });
const gNb = G ? Array.from({length: GN}, () => []) : [];
if (G) for (const [a, b, w] of G.edges){ gNb[a].push([b, w]); gNb[b].push([a, w]); }
// broad keywords (tagged on hundreds of items) count less than specific ones
const gIdf = G ? Float32Array.from(G.terms, t => Math.max(0.2, Math.min(1, Math.log(G.n_items / Math.max(1, t.df)) / Math.log(G.n_items / 100)))) : null;
const G_FLOOR = 0.25;  // propagated weights below this are noise
// ---------- state ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem('ash26.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('ash26.'+k, JSON.stringify(v)); } catch(e){} }
};
let profile = store.get('profile', null) || JSON.parse(JSON.stringify(DEFAULT_PROFILE));
if (!profile.graph) profile.graph = JSON.parse(JSON.stringify(DEFAULT_PROFILE.graph));
let decisions = store.get('decisions', {});
let notes = store.get('notes', {});
let me = store.get('me', '');
const F = Object.assign({day:'all', programs:[], types:{session:true, abstract:true, talk:true}, q:'', minScore:0, decision:'all', sort:'score', hidePosters:false, sharedOnly:false, limit:150}, store.get('filters', {}));
F.limit = 150; F.sharedOnly = false;
let selected = null, tab = 'rank', maxScore = 1;
let shared = null;       // {name, attend:Set, maybe:Set, profile}
let gWeight = null;      // propagated keyword weights (Float32Array over graph terms)
let gSeeds = new Map();  // term id -> seed weight
// ---------- scoring ----------
function termRe(term){
  const t = (term||'').trim(); if(!t) return null;
  const toks = t.split(/[\s\-]+/).filter(Boolean).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!toks.length) return null;
  const b1 = /^\w/.test(t) ? '\\b' : '', b2 = /\w$/.test(t) ? '\\b' : '';
  try { return new RegExp(b1 + toks.join('[\\s\\-]*') + b2, 'gi'); } catch(e){ return null; }
}
function count(re, s){ if(!s || !re) return 0; let n = 0; re.lastIndex = 0; while(re.exec(s)){ n++; if(n >= 8) break; } re.lastIndex = 0; return n; }
function compile(p){
  const mk = arr => (arr||[]).map(t => ({term:t, re:termRe(t)})).filter(x=>x.re);
  return {
    topics: (p.topics||[]).filter(t => t.enabled !== false).map(t => ({name:t.name, weight:+t.weight||1, terms: mk(t.terms)})),
    people: mk(p.people), institutions: mk(p.institutions), negatives: mk(p.negatives), programWeights: p.programWeights||{}
  };
}
function computeGraphWeights(){
  gSeeds = new Map(); gWeight = null;
  if (!G) return;
  const g = profile.graph || DEFAULT_PROFILE.graph;
  const muted = new Set((g.muted||[]).map(m => gIndex.get(normKey(m))).filter(x => x != null));
  for (const t of (profile.topics||[])){
    if (t.enabled === false) continue;
    for (const term of t.terms||[]){
      const id = gIndex.get(normKey(term));
      if (id != null && !muted.has(id) && G.terms[id].df <= 0.08 * G.n_items) gSeeds.set(id, Math.max(gSeeds.get(id)||0, +t.weight||1));   // skip tags applied to >8% of items
    }
  }
  const w = new Float32Array(GN); for (const [id, s] of gSeeds) w[id] = s;
  const alpha = +g.alpha || 0, hops = Math.max(0, Math.min(3, +g.hops || 0));
  let cur = w;
  for (let h = 0; h < hops; h++){
    const nxt = new Float32Array(cur);
    for (let v = 0; v < GN; v++){
      if (muted.has(v)) { nxt[v] = 0; continue; }
      let acc = 0;
      for (const [u, ew] of gNb[v]) if (cur[u] > 0) acc += cur[u] * ew;
      if (acc > 0){ const seed = gSeeds.get(v) || 0; nxt[v] = Math.max(seed, Math.min(5, seed + alpha * acc)); }
    }
    cur = nxt;
  }
  for (const m of muted) cur[m] = 0;
  gWeight = cur;
}
function graphScore(it){
  if (!gWeight) return [0, []];
  const strength = +(profile.graph && profile.graph.strength) || 0;
  if (!strength) return [0, []];
  let s = 0; const hits = [];
  for (const t of it._gt){ const w = gWeight[t]; if (w >= G_FLOOR){ const v = 2*w*gIdf[t]; s += v; hits.push([t, v]); } }
  for (const t of it._gb){ const w = gWeight[t]; if (w >= G_FLOOR){ const v = w*gIdf[t]; s += v; hits.push([t, v]); } }
  const val = strength * 6 * Math.log1p(s / 4);   // diminishing returns so long abstracts do not dominate
  hits.sort((a,b)=>b[1]-a[1]);
  return [val, hits.slice(0, 8)];
}
function scoreItem(it, P){
  let total = 0; const why = [];
  for (const t of P.topics){
    let ts = 0; const matched = [];
    for (const {term, re} of t.terms){
      const inT = count(re, it._title) > 0, inK = count(re, it._kw) > 0, inS = count(re, it._sess) > 0, nA = count(re, it._abs), nD = count(re, it._desc);
      const s = (inT?3:0) + (inK?2:0) + (inS?1.5:0) + (nA ? Math.min(2, 1 + 0.25*(nA-1)) : 0) + (nD?1:0);
      if (s > 0){ ts += s; matched.push(term); }
    }
    if (ts > 0){ const c = t.weight * Math.min(ts, 8); total += c; why.push({topic:t.name, terms:matched, points:c}); }
  }
  const [gs, ghits] = graphScore(it);
  it._gscore = gs; it._ghits = ghits;
  total += gs;
  const pw = P.programWeights[it.program] ?? 1; total *= pw;
  let bonus = 0; const hits = [];
  for (const {term, re} of P.people) if (count(re, it._people)) { bonus += 8; hits.push('Person: ' + term); }
  for (const {term, re} of P.institutions) if (count(re, it._aff) || count(re, it._desc)) { bonus += 3; hits.push('Institution: ' + term); }
  for (const {term, re} of P.negatives) if (count(re, it._title) || count(re, it._abs) || count(re, it._kw)) { bonus -= 8; hits.push('Excluded: ' + term); }

}
function scoreAll(){
  computeGraphWeights();
  const P = compile(profile);
  for (const it of items) scoreItem(it, P);
  maxScore = 1;
  for (const it of items){
    if (it.children && it.children.length){
      const cs = it.children.map(c => byId.get(c)).filter(Boolean).map(c => c._own).sort((a,b)=>b-a).slice(0,3);
      const m = cs.length ? cs.reduce((a,b)=>a+b,0)/cs.length : 0;
      it._childBoost = 0.6*m; it._score = it._own + it._childBoost;
    } else { it._childBoost = 0; it._score = it._own; }
    if (it._score > maxScore) maxScore = it._score;
  }
}

function visible(){
  const q = F.q.trim().toLowerCase();
  const progSet = new Set(F.programs);
  const arr = items.filter(it => {
    if (F.day !== 'all' && it.date !== F.day) return false;
    if (!F.types[it.type]) return false;
    if (progSet.size && !progSet.has(it.program)) return false;
    if (F.hidePosters && isPoster(it)) return false;
    if (it._score < F.minScore) return false;
    if (F.sharedOnly && shared && !(shared.attend.has(it.id) || shared.maybe.has(it.id))) return false;
    const d = decisions[it.id];
    if (F.decision === 'undecided' && d) return false;
    if (F.decision === 'chosen' && !(d === 'attend' || d === 'maybe')) return false;
    if (F.decision === 'attend' && d !== 'attend') return false;
    if (F.decision === 'maybe' && d !== 'maybe') return false;
    if (F.decision === 'skip' && d !== 'skip') return false;
    if (q && !it._blob.includes(q)) return false;
    return true;
  });
  const byTime = (a,b) => (a.date||'').localeCompare(b.date||'') || ((a._min??0)-(b._min??0)) || (a.type==='session'?-1:1) || a._title.localeCompare(b._title);
  arr.sort(F.sort === 'time' ? byTime : (a,b) => (b._score - a._score) || byTime(a,b));
  return arr;
}

  const terms = P.topics.flatMap(t => t.terms).concat(P.people, P.institutions);
  for (const {re} of terms){ out = out.replace(new RegExp(re.source, 'gi'), m => `\u0001${m}\u0002`); }

    if (e.ash_url) desc += '\n' + e.ash_url;
    lines.push('BEGIN:VEVENT', `UID:ash2026-${e.id}@planner`, `DTSTAMP:${icsDate('2026-11-04','12:00')}`, `DTSTART:${icsDate(e.date, e.start)}`, `DTEND:${icsDate(e.date, e.end)}`,
      `SUMMARY:${icsEsc(d + (e.number && !e._isGroup ? '#'+e.number+' ' : '') + e.title)}`, `LOCATION:${icsEsc(e.location||'')}`, `DESCRIPTION:${icsEsc(desc)}`, e.ash_url ? `URL:${e.ash_url}` : '', 'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  download('ash2026-my-schedule.ics', lines.filter(Boolean).join('\r\n'), 'text/calendar');
}
function exportCsv(){
  const rows = items.filter(it => decisions[it.id] && decisions[it.id] !== 'skip').sort((a,b)=>(a.date||'').localeCompare(b.date||'')||((a._min??0)-(b._min??0)));
  if (!rows.length){ toast('Nothing marked yet'); return; }
  const cols = ['decision','date','start','end','location','program','type','number','title','session_title','presenters','score','note','ash_url'];
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const out = [cols.join(',')].concat(rows.map(it => cols.map(c => q(c==='decision'?decisions[it.id]:c==='presenters'?(it.presenters||[]).join('; '):c==='score'?it._score.toFixed(1):c==='note'?(notes[it.id]||''):it[c])).join(',')));
  download('ash2026-my-picks.csv', out.join('\n'), 'text/csv');
}
const b64u = { enc: bytes => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }, dec: s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)) };
async function compress(str){ const bytes = new TextEncoder().encode(str); if (!('CompressionStream' in window)) return 'r' + b64u.enc(bytes); const cs = new CompressionStream('deflate-raw'); const w = cs.writable.getWriter(); w.write(bytes); w.close(); const out = new Uint8Array(await new Response(cs.readable).arrayBuffer()); return 'z' + b64u.enc(out); }
async function decompress(s){ const bytes = b64u.dec(s.slice(1)); if (s[0] === 'r') return new TextDecoder().decode(bytes); const ds = new DecompressionStream('deflate-raw'); const w = ds.writable.getWriter(); w.write(bytes); w.close(); return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()); }
async function makeShareLink(){
  if (!me){ const v = prompt('Your name (shown to whoever opens the link):', ''); if (v === null) return; me = v.trim(); store.set('me', me); renderWho(); }
  const payload = {n: me || 'A friend', a: Object.keys(decisions).filter(k => decisions[k]==='attend' && byId.has(k)), m: Object.keys(decisions).filter(k => decisions[k]==='maybe' && byId.has(k)), p: profile};
  const url = location.href.split('#')[0] + '#share=' + await compress(JSON.stringify(payload));
  try { await navigator.clipboard.writeText(url); toast(`Link copied (${(url.length/1024).toFixed(1)} KB). Whoever opens it keeps their own picks.`); } catch(e){ prompt('Copy this link:', url); }
}
async function loadShare(){
  const m = location.hash.match(/#share=([^&]+)/); if (!m) return;
  try {
    const p = JSON.parse(await decompress(m[1]));
    shared = {name: p.n || 'A friend', attend: new Set(p.a||[]), maybe: new Set(p.m||[]), profile: p.p || null};
    const b = document.getElementById('banner');
    b.style.display = 'flex';
    b.innerHTML = `<b>${esc(shared.name)}</b> shared ${shared.attend.size} attend / ${shared.maybe.size} maybe picks${shared.profile?' and an interest profile':''}. Your own picks are untouched.
      <button class="btn tiny" id="shOverlay">Show only their picks</button>
      <button class="btn tiny" id="shImport">Copy their picks into mine</button>
      ${shared.profile ? '<button class="btn tiny" id="shProfile">Use their interest profile</button>' : ''}
      <button class="btn tiny" id="shDismiss">Dismiss</button>`;
    b.querySelector('#shOverlay').addEventListener('click', () => { F.sharedOnly = true; F.decision = 'all'; switchTab('rank'); renderSide(); renderList(); });
    b.querySelector('#shImport').addEventListener('click', () => { if (!confirm(`Add ${shared.name}'s picks to yours? Your existing decisions are kept.`)) return; for (const id of shared.attend) if (!decisions[id]) decisions[id] = 'attend'; for (const id of shared.maybe) if (!decisions[id]) decisions[id] = 'maybe'; store.set('decisions', decisions); renderList(); renderStats(); toast('Imported'); });
    const sp = b.querySelector('#shProfile'); if (sp) sp.addEventListener('click', () => { if (!confirm(`Replace your interest profile with ${shared.name}'s?`)) return; profile = shared.profile; if (!profile.graph) profile.graph = JSON.parse(JSON.stringify(DEFAULT_PROFILE.graph)); rescore('Profile replaced'); });
    b.querySelector('#shDismiss').addEventListener('click', () => { shared = null; F.sharedOnly = false; b.style.display = 'none'; history.replaceState(null, '', location.pathname + location.search); renderSide(); renderList(); });
    renderSide(); renderList();
  } catch(e){ console.warn('share link unreadable', e); }
}
// ---------- tabs / stats ----------
function switchTab(t){
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  const cal = document.getElementById('cal'), web = document.getElementById('web'), main = document.getElementById('main'), side = document.getElementById('side'), det = document.getElementById('detail');
  cal.style.display = 'none'; web.classList.remove('on');
  if (t === 'cal'){ cal.style.display = 'block'; main.style.display = side.style.display = det.style.display = 'none'; renderCal(); }
  else if (t === 'web'){ web.classList.add('on'); main.style.display = side.style.display = det.style.display = 'none'; renderWeb(); }
  else { main.style.display = side.style.display = det.style.display = ''; if (t === 'profile') renderProfile(); else renderDetail(); }
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) switchTab(b.dataset.tab); });
function renderWho(){ document.getElementById('who').textContent = me || 'You'; }
document.getElementById('who').addEventListener('click', () => { const v = prompt('Your name (used in share links and the calendar title):', me || ''); if (v !== null){ me = v.trim(); store.set('me', me); renderWho(); } });
function renderStats(){
  const m = DATA.meta || {};
  document.getElementById('stats').textContent = `${(m.items||items.length).toLocaleString()} items · ${(m.with_abstract||0).toLocaleString()} abstracts · ${Object.values(decisions).filter(d=>d==='attend').length} attend / ${Object.values(decisions).filter(d=>d==='maybe').length} maybe`;
}
function renderAll(){ renderWho(); renderSide(); renderList(); renderStats(); if (tab==='profile') renderProfile(); else if (tab==='web') renderWeb(); else renderDetail(); }
window.addEventListener('resize', () => { if (tab === 'web') drawWeb(); });
scoreAll(); renderAll(); loadShare();
</script>
