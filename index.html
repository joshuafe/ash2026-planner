<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Conference Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f8fb; --card:#ffffff; --ink:#241f2e; --ink2:#4e4760; --muted:#7a7388; --hair:#e6e3ec; --hair2:#d3cfdc;
  --stain:#5b3fa0; --stain-deep:#3f2a78; --stain-soft:#ece6f7; --stain-mid:#c9bde6;
  --eosin:#d4607f; --eosin-soft:#fbe9ee; --sky-soft:#e6eef7;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --nav:64px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--stain)}
h1,h2,h3{margin:0;font-weight:500}
:focus-visible{outline:2px solid var(--stain);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
/* ---------- app frame ---------- */
#top{position:sticky;top:0;z-index:20;background:rgba(247,248,251,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;max-width:1180px;margin:0 auto}
.wordmark{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--stain-deep);display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:2px 6px 2px 0}
.wordmark svg{opacity:.6}
.confrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--hair2);border-radius:14px;background:var(--card)}
.confrow.on{border-color:var(--stain);background:var(--stain-soft)}
.confrow b{font-family:var(--serif);font-size:18px;font-weight:600}
.wordmark small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.topbar .grow{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:active{background:var(--stain-soft)}
.iconbtn svg{width:22px;height:22px}
.namebtn{font-size:14px;color:var(--stain-deep);background:var(--stain-soft);border-radius:999px;padding:6px 12px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbar{display:flex;gap:8px;align-items:center;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none;max-width:1180px;margin:0 auto}
.subbar::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--hair2);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink2);background:var(--card);line-height:1}
.pill.on{background:var(--stain);border-color:var(--stain);color:#fff}
.pill b{font-family:var(--serif);font-weight:600;font-size:15px}
.searchrow{display:flex;gap:8px;padding:0 16px 10px;max-width:1180px;margin:0 auto}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--hair2);border-radius:14px;padding:0 12px;height:44px}
.search input{flex:1;border:0;background:none;outline:0;font-size:16px;min-width:0;padding:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--hair2);background:var(--card);color:var(--ink);font-size:15px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--stain);border-color:var(--stain);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--stain-deep)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.danger{color:#a3324f}
.btn[disabled]{opacity:.45}
.badge{display:inline-block;background:var(--stain-soft);color:var(--stain-deep);border-radius:999px;padding:1px 8px;font-size:12.5px}
#views{max-width:1180px;margin:0 auto;padding:0 0 calc(var(--nav) + var(--safe-b) + 16px)}
.view{display:none}.view.on{display:block}
/* ---------- bottom nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--hair);padding-bottom:var(--safe-b)}
#nav ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;height:var(--nav)}
#nav li{position:relative}
#nav button{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--stain-deep)}
#nav button.on svg{stroke-width:2.2}
#nav .count{position:absolute;left:calc(50% + 8px);top:8px;background:var(--stain);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:16px;pointer-events:none}
/* ---------- entries (timeline list) ---------- */
.list{padding:4px 0}
.entry{display:grid;grid-template-columns:58px 18px 1fr 44px;gap:0 8px;padding:12px 10px 12px 14px;border-bottom:1px solid var(--hair);align-items:start;cursor:pointer;position:relative}
.entry:active{background:#fbfbfd}
.entry.sel{background:#f3f0fa}
.entry .when{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13.5px;line-height:1.3;padding-top:2px}
.entry .when .day{display:block;font-family:var(--serif);font-weight:600;font-size:14px;color:var(--ink)}
.entry .when .t2{display:block;color:var(--muted)}
.fit{padding-top:6px}
.fit i{display:block;width:12px;height:12px;border-radius:50%;background:var(--stain);transform:scale(var(--f,.4));opacity:calc(.35 + var(--f,.4)*.65)}
.entry.skip .fit i{background:var(--hair2)}
.entry .body{min-width:0}
.entry h3{font-size:16.5px;line-height:1.3;font-weight:700;letter-spacing:-.005em}
.entry .meta{margin:3px 0 0;font-size:13.5px;color:var(--muted);line-height:1.35}
.entry .meta b{color:var(--ink2);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;line-height:1.4;background:var(--stain-soft);color:var(--stain-deep);text-decoration:none}
.chip.rel{background:var(--sky-soft);color:#2e4a6b}
.chip.pink{background:var(--eosin-soft);color:#8f3a53}
.chip.tag{background:transparent;border:1px solid var(--hair2);color:var(--ink2)}
.entry .quick{align-self:center;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--hair2)}
.entry .quick svg{width:22px;height:22px;fill:currentColor}
.entry.attend .quick{color:var(--stain)}
.entry.maybe .quick{color:var(--eosin)}
.entry.attend{box-shadow:inset 4px 0 0 var(--stain)}
.entry.maybe{box-shadow:inset 4px 0 0 var(--eosin)}
.entry.skip{opacity:.5}
.more{display:block;width:100%;padding:16px;color:var(--stain-deep);background:none;border-bottom:1px solid var(--hair)}
.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:500;margin-bottom:6px}
.section-h{font-family:var(--serif);font-size:22px;font-weight:500;padding:18px 16px 6px;line-height:1.2}
.section-h small{display:block;font-family:var(--sans);font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.4}
/* ---------- sheets ---------- */
.sheet-back{position:fixed;inset:0;background:rgba(36,31,46,.35);z-index:40;opacity:0;transition:opacity .2s}
.sheet-back.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;top:0;z-index:41;background:var(--card);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet.half{top:auto;max-height:88vh;border-radius:22px 22px 0 0}
.sheet .sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 16px;border-bottom:1px solid var(--hair);flex:0 0 auto}
.sheet .sh-head h2{flex:1;font-size:15px;color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}
.sheet .sh-foot{flex:0 0 auto;border-top:1px solid var(--hair);padding:10px 16px calc(10px + var(--safe-b));background:var(--card)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--hair2);margin:8px auto 0}
/* detail */
.d-title{font-family:var(--serif);font-size:24px;line-height:1.22;font-weight:500;letter-spacing:-.01em;margin:4px 0 10px}
.d-when{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:8px 0 12px;align-items:baseline}
.d-when .k{color:var(--muted);font-size:13.5px}
.d-when .big{font-family:var(--serif);font-size:20px;font-weight:500}
.d-sec{margin-top:18px}
.d-sec h4{font-size:13.5px;color:var(--muted);font-weight:400;margin:0 0 6px}
.d-abs{white-space:pre-wrap;font-size:16px;line-height:1.55;color:var(--ink)}
mark{background:var(--eosin-soft);color:inherit;padding:0 2px;border-radius:3px}
.why{font-size:14.5px;margin:4px 0}
.why b{font-weight:700}
.talk{display:grid;grid-template-columns:52px 1fr 36px;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14.5px;cursor:pointer;align-items:start}
.talk .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.talk .s{color:var(--muted);font-size:13px}
.talk .quick{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--hair2)}
.talk .quick svg{width:20px;height:20px;fill:currentColor}
.talk.attend .quick{color:var(--stain)}.talk.maybe .quick{color:var(--eosin)}
.decide{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.decide button{height:48px;border-radius:14px;border:1px solid var(--hair2);background:var(--card);font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.decide button svg{width:20px;height:20px;fill:currentColor}
.decide button.attend.on{background:var(--stain);border-color:var(--stain);color:#fff}
.decide button.maybe.on{background:var(--eosin);border-color:var(--eosin);color:#fff}
.decide button.skip.on{background:var(--ink2);border-color:var(--ink2);color:#fff}
textarea,input[type=text],input[type=search],input[type=number],select{width:100%;border:1px solid var(--hair2);border-radius:12px;padding:10px 12px;background:var(--card);font-size:16px}
textarea{resize:vertical;min-height:72px}
label.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:15px;cursor:pointer}
label.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--stain);flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--hair2);border-radius:12px;overflow:hidden}
.seg button{padding:8px 14px;font-size:14.5px;color:var(--ink2);background:var(--card)}
.seg button.on{background:var(--stain-soft);color:var(--stain-deep);font-weight:700}
.legend{font-size:13.5px;color:var(--muted);line-height:1.45}
.stack{display:flex;flex-direction:column;gap:10px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* ---------- plan (agenda) ---------- */
.agenda{padding:0 0 8px}
.aday{padding:14px 16px 4px;font-family:var(--serif);font-size:22px;font-weight:500;position:sticky;top:0;background:var(--paper);z-index:3}
.aday small{font-family:var(--sans);font-size:13.5px;color:var(--muted);margin-left:8px}
.aitem{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 16px;border-left:4px solid var(--stain);margin:6px 16px;background:var(--card);border-radius:0 14px 14px 0;cursor:pointer}
.aitem.maybe{border-left-color:var(--eosin)}
.aitem.conflict{outline:2px solid var(--eosin);outline-offset:-2px}
.aitem .t{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink2);line-height:1.35}
.aitem .t b{display:block;font-size:15px;color:var(--ink);font-weight:700}
.aitem h3{font-size:15.5px;line-height:1.3;font-weight:700}
.aitem .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.aitem ul{margin:6px 0 0;padding-left:16px;font-size:13.5px;color:var(--ink2)}
.conflict-note{margin:8px 16px;padding:10px 12px;background:var(--eosin-soft);color:#8f3a53;border-radius:12px;font-size:14px}
.gap{color:var(--muted);font-size:13px;padding:2px 32px}
.grid{display:none}
/* ---------- keyword web ---------- */
.kw{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--hair);font-size:15px}
.kw a{color:var(--ink);text-decoration:none;font-weight:700}
.kw .w{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.kw.seed{background:#fffaf0}
.kw.muted{opacity:.45}
.kw button{height:34px;min-width:34px;border-radius:10px;border:1px solid var(--hair2);background:var(--card);padding:0 10px;font-size:14px}
.kw button.on{background:var(--stain-soft);border-color:var(--stain-mid);color:var(--stain-deep)}
#mapwrap{margin:8px 16px;border:1px solid var(--hair2);border-radius:16px;overflow:hidden;background:var(--card);position:relative;height:60vh;display:none}
#mapwrap.on{display:block}
#map{width:100%;height:100%;display:block;touch-action:none}
#mapnote{position:absolute;left:12px;top:10px;font-size:12.5px;color:var(--muted);pointer-events:none;max-width:55%}
@media (max-width:899px){#mapnote{display:none}#mapwrap{height:52vh}}
#mapctl{position:absolute;right:10px;top:8px}
#mapctl .seg button{padding:5px 10px;font-size:13px}
/* ---------- wizard ---------- */
.wiz h2{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.2;margin:6px 0 6px}
.wiz p{margin:0 0 10px}
.bundle{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair)}
.bundle .nm{flex:1;font-size:15.5px}
.bundle .nm small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.step{display:flex;align-items:center;border:1px solid var(--hair2);border-radius:10px;overflow:hidden;flex:0 0 auto}
.step button{width:34px;height:36px;font-size:18px;color:var(--stain-deep);background:var(--card)}
.step span{min-width:30px;text-align:center;font-size:14px}
.found{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.found button{border:1px solid var(--hair2);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--card)}
.found button.on{background:var(--stain-soft);border-color:var(--stain-mid);color:var(--stain-deep)}
/* ---------- profile editor ---------- */
.topic{border:1px solid var(--hair2);border-radius:14px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.topic .head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.topic .head input[type=text]{flex:1;min-width:0}
.topic .head select{width:78px}
.topic .head input[type=checkbox]{width:22px;height:22px;accent-color:var(--stain);flex:0 0 auto}
.topic textarea{font-size:14.5px;min-height:56px}
.pw{display:grid;grid-template-columns:1fr 84px;gap:6px 10px;align-items:center;font-size:14.5px}
.pw input{padding:6px 8px}
.banner{margin:10px 16px 0;padding:12px 14px;background:var(--stain-soft);border-radius:14px;font-size:14.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:60;max-width:92vw;text-align:center}
.mark-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--stain);margin-right:6px;vertical-align:middle}
.mark-dot.pink{background:var(--eosin)}
#dpanel{display:none}
/* ---------- desktop ---------- */
@media (min-width:900px){
  :root{--nav:0px}
  body{font-size:15px}
  #nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--hair);background:rgba(247,248,251,.92)}
  #nav ul{height:52px;max-width:1180px;grid-template-columns:repeat(4,150px);justify-content:start;padding:0 8px}
  #nav button{flex-direction:row;gap:8px;font-size:14.5px}
  #nav button svg{width:20px;height:20px}
  #nav .count{position:absolute;left:auto;right:18px;top:17px}
  #top{top:53px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:0;align-items:start}
  .split > .listwrap{border-right:1px solid var(--hair);min-height:calc(100vh - 170px)}
  #dpanel{display:block;position:sticky;top:172px;max-height:calc(100vh - 172px);overflow:auto;padding:16px 24px 32px}
  #dpanel .d-title{font-size:26px}
  .agenda{display:none}
  .grid{display:grid;grid-template-columns:56px repeat(var(--days),minmax(170px,1fr));margin:12px 16px;border-top:1px solid var(--hair2);border-left:1px solid var(--hair2);background:var(--card);border-radius:14px;overflow:hidden}
  .gcol{position:relative;border-right:1px solid var(--hair);height:calc(var(--hours) * 56px)}
  .gcol .hr{position:absolute;left:0;right:0;border-top:1px solid #f0eef4;font-size:11px;color:var(--muted);padding:2px 0 0 6px;font-variant-numeric:tabular-nums}
  .dayhead{font-family:var(--serif);font-size:16px;font-weight:500;padding:8px 10px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair2);background:var(--paper)}
  .ev{position:absolute;border-radius:8px;padding:5px 7px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;background:var(--stain-soft);border-left:3px solid var(--stain)}
  .ev.maybe{background:var(--eosin-soft);border-left-color:var(--eosin)}
  .ev.conflict{outline:2px solid var(--eosin);outline-offset:-2px}
  .ev .t{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .ev .loc{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .webgrid{display:grid;grid-template-columns:320px minmax(0,1fr) 340px;gap:0}
  .webgrid > div{border-right:1px solid var(--hair);min-height:70vh}
  .webgrid > div:last-child{border-right:0}
  #mapwrap{display:block;height:460px;margin:12px}
  #maptoggle{display:none}
  .entry{grid-template-columns:72px 18px 1fr 44px;padding:12px 16px}
  .me{max-width:720px;margin:0 auto}
  .sheet{left:50%;right:auto;width:min(720px,100vw);transform:translate(-50%,100%)}
  .sheet.on{transform:translate(-50%,0)}
}
@media (max-width:899px){ .webgrid > div{border-bottom:1px solid var(--hair)} }
.hide{display:none !important}
</style>
</head>
<body>
<nav id="nav"><ul>
  <li><button data-v="picks" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="17" r="3"/></svg>Picks</button></li>
  <li><button data-v="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button><span class="count hide" id="navcount"></span></li>
  <li><button data-v="web"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="17" r="2.5"/><path d="M8 8l3 7M16 8l-3 7M8.5 7h7"/></svg>Web</button></li>
  <li><button data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Me</button></li>
</ul></nav>
<header id="top">
  <div class="topbar">

    <label class="row" style="border:0;padding:4px 0"><input type="checkbox" id="feedMaybe" ${withMaybe?'checked':''}> include maybe picks</label>
    <div class="rowbtns"><button class="btn primary" id="feedCopy">Copy feed link</button><a class="btn" id="feedOpen" href="${esc(feedUrl(withMaybe))}" target="_blank" rel="noopener">Open feed</a></div>
    <div class="legend"><b>Outlook</b>: Add calendar, Subscribe from web, paste the link. <b>Google Calendar</b>: Other calendars, From URL. <b>Apple</b>: on iPhone, Settings, Calendar, Accounts, Add Subscribed Calendar; on Mac, File, New Calendar Subscription. Calendar apps refresh subscriptions every few hours.</div>`;
}
function bindSyncSection(v){
  const on = (id, fn) => { const el = v.querySelector(id); if (el) el.addEventListener('click', fn); };
  on('#syncCreate', async () => { if (!me){ askName(); } try { await doSync({create:true}); toast('Sync code created'); renderMe(); } catch(e){ toast('Could not reach the sync service'); } });
  on('#syncEnter', async () => { const k = (prompt('Enter your sync code (like ABCD-EFGH-JKLM):', '') || '').trim().toUpperCase(); if (!k) return; try { await doSync({key:k}); toast('Linked. Your picks from both devices are merged.'); renderMe(); } catch(e){ toast(e.message || 'Could not link'); } });
  on('#syncCopy', () => copyText(sync.key, 'Sync code copied'));
  on('#syncNow', () => doSync().then(() => toast('Synced')).catch(e => toast(e.message || 'Sync failed')));
  on('#syncUnlink', () => { if (!confirm('Unlink this device? Your picks stay here; the account stays on the server for your other devices.')) return; sync = null; gstore.set('sync', null); renderMe(); });
  on('#feedCopy', () => copyText(feedUrl(gstore.get('feedMaybe', true)), 'Feed link copied'));
  const fm = v.querySelector('#feedMaybe'); if (fm) fm.addEventListener('change', e => { gstore.set('feedMaybe', e.target.checked); const a = v.querySelector('#feedOpen'); if (a) a.href = feedUrl(e.target.checked); });
  renderSyncStatus();
}
// ---------- boot ----------
function renderWho(){ document.getElementById('who').textContent = me || 'You'; document.getElementById('confname').textContent = CONF.short; }
function openConfSheet(){
  openSheet(`<div class="sh-head"><h2>Conferences</h2><button class="btn sm quiet" data-close>Done</button></div><div class="sh-body stack">${(window.CONFERENCES||[]).map(c => `<button class="confrow ${c.id===CONF.id?'on':''}" data-conf="${esc(c.id)}"><b>${esc(c.short)}</b><span>${esc(c.name)}</span><span class="legend">${esc(c.when)}, ${esc(c.venue)}</span></button>`).join('')}<p class="legend">Your interests, name and sync code carry over; picks and notes stay with each conference.</p></div>`, true);
  sheetEl.querySelector('.sh-body').addEventListener('click', e => { const b = e.target.closest('[data-conf]'); if (!b) return; if (b.dataset.conf === CONF.id){ closeSheet(); return; } gstore.set('conf', b.dataset.conf); try { localStorage.setItem('planner.conf', b.dataset.conf); } catch(err){} location.href = location.pathname + '?c=' + b.dataset.conf; });
}
document.getElementById('confbtn').addEventListener('click', openConfSheet);
function renderStats(){ const n = Object.values(decisions).filter(d=>d==='attend').length + Object.values(decisions).filter(d=>d==='maybe').length; const c = document.getElementById('navcount'); c.textContent = n; c.classList.toggle('hide', !n); document.getElementById('stats').textContent = profile.topics.length ? '' : 'no interests yet'; }
function renderAll(){ renderWho(); renderStats(); renderSubbar(); if (view==='picks') renderPicks(); if (view==='plan') renderPlan(); if (view==='web') renderWeb(); if (view==='me') renderMe(); }
document.getElementById('who').addEventListener('click', askName);
document.getElementById('searchbtn').addEventListener('click', () => { switchView('picks'); const q = document.getElementById('q'); if (q){ q.focus(); q.scrollIntoView({block:'center'}); } });
window.addEventListener('resize', () => { if (view === 'web') drawMap(); });
scoreAll(); renderAll(); loadShare().then(() => { if (firstRun && !shared) setTimeout(openWizard, 400); });
if (sync) doSync().catch(e => console.warn('sync', e));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sync) doSync().catch(() => {}); });
// debug handle (used by automated checks)
window.P = {CONF, items, byId, days, programs, GN, EXAMPLE_PROFILE, gstore, store, setDecision, exportIcs, buildIcs, doSync, feedUrl, openConfSheet, closeSheet, scoreAll, renderAll, switchView, dayShort, fmtRange, openWizard,
  get profile(){ return profile; }, set profile(v){ profile = v; }, get lastVisible(){ return lastVisible; }, get sync(){ return sync; }, get gSeeds(){ return gSeeds; }, get firstRun(){ return firstRun; }, set firstRun(v){ firstRun = v; }, get sheetOpen(){ return sheetOpen; }, get decisions(){ return decisions; }, clearSyncTimer(){ clearTimeout(syncTimer); }};
};
</script>
